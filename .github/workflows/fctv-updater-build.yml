name: FCTV Clean Updater build
on:
  push:
    branches: [ tmp-fctv-clean-updater-build ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: fctv-updater-build
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        working-directory: fctv-updater-build
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FCTV-Clean-Updater-APK
          path: fctv-updater-build/app/build/outputs/apk/debug/app-debug.apk
