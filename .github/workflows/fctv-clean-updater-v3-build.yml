name: FCTV Clean Updater 3.0 build
on:
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        working-directory: fctv-clean-updater-v3
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify no installer permission
        run: |
          APK=fctv-clean-updater-v3/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK" | tee /tmp/permissions.txt
          ! grep -q 'REQUEST_INSTALL_PACKAGES' /tmp/permissions.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: FCTV-Clean-Updater-3.0-unsigned
          path: fctv-clean-updater-v3/app/build/outputs/apk/release/app-release-unsigned.apk
