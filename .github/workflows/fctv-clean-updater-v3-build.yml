name: FCTV Clean Updater 3.1 build
on:
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Patch 3.0 source to 3.1 verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fctv-clean-updater-v3/app/src/main/java/com/fctvclean/updater/MainActivity.java')
          s = p.read_text()
          old = 'String signer = packageInfoSignerSha256(pi);'
          new = 'String signer = ApkCert.signerSha256(apk, EXPECTED_FCTV_CERT_SHA256);'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one official signer check, found {s.count(old)}')
          s = s.replace(old, new)
          # Verifica anche il file CLEAN dopo la firma, in entrambi i percorsi online/manuale.
          marker = 'signApk(unsigned, signed);'
          if s.count(marker) != 2:
              raise SystemExit(f'expected two signApk calls, found {s.count(marker)}')
          s = s.replace(marker, marker + '\n        ApkCert.assertVerified(signed);')
          s = s.replace('FCTV CLEAN Updater 3.0', 'FCTV CLEAN Updater 3.1')
          s = s.replace('FCTV-Clean-Updater/3.0 Android', 'FCTV-Clean-Updater/3.1 Android')
          s = s.replace("L'Updater 3.0 non possiede", "L'Updater 3.1 non possiede")
          p.write_text(s)

          g = Path('fctv-clean-updater-v3/app/build.gradle')
          t = g.read_text()
          t = t.replace('versionCode 300', 'versionCode 310')
          t = t.replace("versionName '3.0'", "versionName '3.1'")
          g.write_text(t)
          PY
      - name: Build release APK
        working-directory: fctv-clean-updater-v3
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify manifest and collect unsigned APK
        run: |
          set -e
          UNSIGNED=fctv-clean-updater-v3/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$UNSIGNED"
          mkdir -p out
          cp "$UNSIGNED" out/FCTV_Clean_Updater_3.1_unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$UNSIGNED" | tee out/APK_PERMISSIONS.txt
          ! grep -q 'REQUEST_INSTALL_PACKAGES' out/APK_PERMISSIONS.txt
          sha256sum "$UNSIGNED" | tee out/SHA256_UNSIGNED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FCTV-Clean-Updater-3.1-unsigned
          path: out/
